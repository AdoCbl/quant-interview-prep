[project]
name = "quantprep"
version = "0.1.0"
description = "Quant research / quant developer interview preparation"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "statsmodels",
    "scikit-learn",
]

[dependency-groups]
dev = ["pytest", "jupyterlab", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
